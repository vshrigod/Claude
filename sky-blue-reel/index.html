  let f=0;for(const c of[5.62,10.12]){f=Math.max(f,Math.pow(clamp(1-Math.abs(t-c)/.2),1.4))}
  f=Math.max(f,Math.pow(clamp(1-Math.abs(t-3.47)/.12),2)*.35);f=Math.max(f,clamp(1-t/.15));
  flash.style.opacity=f;
  const cp=seg(t,6.3,6.6),cq=1-seg(t,9.6,9.85);const cs=easeOutBack(cp);chip.style.opacity=Math.min(cp*3,1)*cq;
  chip.style.transform=`translateX(-50%) scale(${cs*cq}) rotate(${-3+Math.sin(t*3)*1.5}deg)`;
  badge.style.transform=`translateX(-50%) rotate(${Math.sin(t*2.4)*2}deg) scale(${1+.04*Math.sin(t*5)})`;
  CAPS.forEach(g=>{
    const vis=t>=g.s-.01&&t<g.e+.15;g.el.style.display=vis?'block':'none';if(!vis)return;
    const out=seg(t,g.e,g.e+.15);
    g.words.forEach((W,i)=>{
      const p=seg(t,W.t,W.t+.22);
      const next=g.words[i+1]?g.words[i+1].t:g.e;const active=t>=W.t&&t<next+.05;
      let s=p<=0?0:easeOutBack(p);s*=1-out;
      const wob=W.emoji?Math.sin(t*8+i)*10:Math.sin(t*4+i*1.7)*2.5;
      const lift=active?-10:0;const big=active&&!W.emoji?1.1:1;
      W.w.style.opacity=p>0?1:0;
      W.w.style.transform=`translateY(${lift+(1-Math.min(p*1.4,1))*60}px) scale(${s*big}) rotate(${wob+(1-p)*-12}deg)`;
      if(!W.col&&!W.emoji)W.w.style.color=active?Y:'#fff';
    });
  });
}

window.EVENTS=EVENTS;
window.renderAt=(t)=>{
  let scene,cam;
  if(t<5.62){updateS1(t);scene=S1;cam=cam1;bloom.strength=.55;bloom.threshold=1.1}
  else if(t<10.12){updateS2(t);scene=S2;cam=cam2;bloom.strength=.6;bloom.threshold=1.05}
  else{updateS3(t);scene=S3;cam=cam3;bloom.strength=.45;bloom.threshold=1.3}
  rpass.scene=scene;rpass.camera=cam;composer.render();updateUI(t);
};
await document.fonts.load('124px "Luckiest Guy"');await document.fonts.load('46px "Fredoka"');
await document.fonts.ready;
window.renderAt(0);window.READY=true;
